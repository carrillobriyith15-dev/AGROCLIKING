  {id:"pr-10", name:"Café excelso", cat:"Granos", price:22000, unit:"libra", stock:20, origin:"Antioquia", producerId:"u-p2", emoji:"☕", desc:"Café excelso de finca, tueste medio, notas a panela y frutos rojos.", active:true},
  {id:"pr-11", name:"Miel de abejas", cat:"Otros", price:18000, unit:"frasco", stock:12, origin:"Huila", producerId:"u-p4", emoji:"🍯", desc:"Miel 100% pura de apiario propio, sin procesar.", active:true},
  {id:"pr-12", name:"Papa criolla", cat:"Verduras", price:2600, unit:"kg", stock:0, origin:"Boyacá", producerId:"u-p1", emoji:"🥔", desc:"Papa criolla amarilla, calibrada y lista para cocinar.", active:true},
]);

const seedReviews = () => ([
  {id:"rv-1", productId:"pr-1", buyerId:"u-c1", buyerName:"Ana Torres", rating:5, comment:"Tomates muy frescos, llegaron el mismo día.", reply:"", createdAt:now()},
  {id:"rv-2", productId:"pr-7", buyerId:"u-c1", buyerName:"Ana Torres", rating:4, comment:"Excelente sabor, un poco salado para mi gusto.", reply:"¡Gracias Ana! Podemos preparar un lote bajo en sal si lo prefieres.", createdAt:now()},
]);

/* ---------------- Small components ---------------- */
function Stars({value}){
  const v = Math.round(value || 0);
  return <span className="p-stars">{"★".repeat(v)}{"☆".repeat(5-v)}</span>;
}

function StockPill({stock}){
  if(stock <= 0) return <span className="stock-pill stock-out">Agotado</span>;
  if(stock <= 8) return <span className="stock-pill stock-low">Últimas {stock}</span>;
  return <span className="stock-pill stock-ok">Disponible</span>;
}

function Modal({title, onClose, children, lg}){
  return (
    <div className="overlay" onClick={(e)=>{if(e.target===e.currentTarget) onClose();}}>
      <div className={"modal" + (lg ? " modal-lg" : "")}>
        <div className="modal-head">
          <h3>{title}</h3>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App(){
  const [users, setUsers] = useState(seedUsers());
  const [products, setProducts] = useState(seedProducts());
  const [reviews, setReviews] = useState(seedReviews());
  const [orders, setOrders] = useState([]);
  const [notifications, setNotifications] = useState([]);
  const [currentUserId, setCurrentUserId] = useState(null);
  const [cart, setCart] = useState([]); // {productId, qty}
  const [view, setView] = useState("home");
  const [query, setQuery] = useState("");
  const [authOpen, setAuthOpen] = useState(false);
  const [authTab, setAuthTab] = useState("login");
  const [cartOpen, setCartOpen] = useState(false);
  const [userMenuOpen, setUserMenuOpen] = useState(false);
  const [activeProduct, setActiveProduct] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [filters, setFilters] = useState({cats:[], min:"", max:"", onlyAvailable:false, sort:"popularidad"});

  const currentUser = users.find(u=>u.id===currentUserId) || null;

  const pushToast = (msg, icon) => {
    const id = uid("t");
    setToasts(t => [...t, {id, msg, icon: icon||"✅"}]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 3200);
  };

  const notify = (userId, type, message) => {
    setNotifications(n => [{id:uid("n"), userId, type, message, read:false, createdAt:now()}, ...n]);
  };

  const goto = (v) => { setView(v); setUserMenuOpen(false); window.scrollTo({top:0, behavior:"smooth"}); };

  /* ---- Auth ---- */
  const login = (email, password) => {
    const u = users.find(x=>x.email.toLowerCase()===email.toLowerCase() && x.password===password);
    if(!u) return "No encontramos una cuenta con ese correo y contraseña.";
    if(u.status === "bloqueado") return "Esta cuenta ha sido bloqueada por un administrador.";
    setCurrentUserId(u.id); setAuthOpen(false);
    pushToast("¡Bienvenido/a, " + u.name.split(" ")[0] + "!", "👋");
    return null;
  };
  const register = (data) => {
    if(users.some(u=>u.email.toLowerCase()===data.email.toLowerCase())) return "Ya existe una cuenta con ese correo.";
    const u = {
      id: uid("u"), role: data.role, name: data.name, email: data.email, password: data.password,
      location: data.location, finca: data.role==="productor" ? data.finca : undefined,
      avatar: data.role==="productor" ? "🧑‍🌾" : "🙂", verified: data.role==="productor" ? false : undefined,
      status:"activo", prefs:{email:true,push:true,sms:false}
    };
    setUsers(us => [...us, u]);
    setCurrentUserId(u.id); setAuthOpen(false);
    pushToast("Cuenta creada. ¡Bienvenido/a a AgroClicking!", "🌱");
    if(u.role==="productor") notify(u.id, "sistema", "Puedes solicitar la verificación de tu finca desde tu panel de productor.");
    return null;
  };
  const logout = () => { setCurrentUserId(null); setCart([]); goto("home"); };
  const quickLogin = (email) => login(email, users.find(u=>u.email===email).password);

  /* ---- Cart ---- */
  const addToCart = (productId, qty) => {
    setCart(c => {
      const ex = c.find(i=>i.productId===productId);
      if(ex) return c.map(i => i.productId===productId ? {...i, qty: i.qty+qty} : i);
      return [...c, {productId, qty}];
    });
    pushToast("Agregado al carrito", "🛒");
  };
  const setCartQty = (productId, qty) => {
    setCart(c => qty<=0 ? c.filter(i=>i.productId!==productId) : c.map(i=> i.productId===productId ? {...i, qty} : i));
  };
  const removeFromCart = (productId) => setCart(c => c.filter(i=>i.productId!==productId));

  const cartLines = cart.map(i => ({...i, product: products.find(p=>p.id===i.productId)})).filter(l=>l.product);
  const cartTotal = cartLines.reduce((s,l)=> s + l.product.price*l.qty, 0);

  /* ---- Orders ---- */
  const placeOrder = (paymentMethod, location) => {
    const items = cartLines.map(l => ({productId:l.productId, name:l.product.name, qty:l.qty, price:l.product.price, producerId:l.product.producerId, unit:l.product.unit}));
    const order = {
      id: uid("ORD-"), buyerId: currentUser.id, items, total: cartTotal, paymentMethod, location,
      status:"pendiente", createdAt: now(), timeline:[{status:"pendiente", date: now()}]
    };
    setOrders(o => [order, ...o]);
    setProducts(ps => ps.map(p => {
      const line = items.find(i=>i.productId===p.id);
      if(!line) return p;
      const newStock = Math.max(0, p.stock - line.qty);
      return {...p, stock:newStock};
    }));
    notify(currentUser.id, "pedido", "Tu pedido " + order.id + " fue creado y está pendiente de confirmación.");
    [...new Set(items.map(i=>i.producerId))].forEach(pid => notify(pid, "pedido", "Nuevo pedido " + order.id + " recibido de " + currentUser.name + "."));
    setCart([]); setCartOpen(false);
    pushToast("Pedido " + order.id + " creado con éxito", "📦");
    return order;
  };
  const advanceOrder = (orderId) => {
    setOrders(os => os.map(o => {
      if(o.id!==orderId) return o;
      const idx = STATUS_FLOW.indexOf(o.status);
      const next = STATUS_FLOW[idx+1];
      if(!next) return o;
      notify(o.buyerId, "pedido", "Tu pedido " + o.id + " ahora está: " + STATUS_LABEL[next] + ".");
      return {...o, status:next, timeline:[...o.timeline, {status:next, date:now()}]};
    }));
  };
  const cancelOrder = (orderId) => {
    setOrders(os => os.map(o => {
      if(o.id!==orderId || o.status!=="pendiente") return o;
      setProducts(ps => ps.map(p => {
        const line = o.items.find(i=>i.productId===p.id);
        return line ? {...p, stock: p.stock + line.qty} : p;
      }));
      [...new Set(o.items.map(i=>i.producerId))].forEach(pid => notify(pid, "pedido", "El pedido " + o.id + " fue cancelado por el comprador."));
      return {...o, status:"cancelado", timeline:[...o.timeline, {status:"cancelado", date:now()}]};
    }));
    pushToast("Pedido cancelado", "🚫");
  };

  /* ---- Reviews ---- */
  const addReview = (productId, rating, comment) => {
    const r = {id:uid("rv-"), productId, buyerId:currentUser.id, buyerName:currentUser.name, rating, comment, reply:"", createdAt:now()};
    setReviews(rs => [r, ...rs]);
    const prod = products.find(p=>p.id===productId);
    if(prod) notify(prod.producerId, "reseña", currentUser.name + " calificó tu producto " + prod.name + " con " + rating + " ★.");
    pushToast("¡Gracias por tu reseña!", "⭐");
  };
  const replyReview = (reviewId, text) => {
    setReviews(rs => rs.map(r => r.id===reviewId ? {...r, reply:text} : r));
    pushToast("Respuesta publicada", "💬");
  };

  /* ---- Products (producer CRUD) ---- */
  const upsertProduct = (data) => {
    if(data.id){
      setProducts(ps => ps.map(p => p.id===data.id ? {...p, ...data, stock:Number(data.stock), price:Number(data.price)} : p));
      pushToast("Producto actualizado", "✏️");
    } else {
      const p = {...data, id:uid("pr-"), producerId:currentUser.id, price:Number(data.price), stock:Number(data.stock), active:true};
      setProducts(ps => [p, ...ps]);
      pushToast("Producto publicado en el catálogo", "🌱");
    }
  };
  const deleteProduct = (id) => { setProducts(ps => ps.filter(p=>p.id!==id)); pushToast("Producto eliminado", "🗑️"); };

  /* ---- Admin actions ---- */
  const setUserStatus = (id, status) => setUsers(us => us.map(u=>u.id===id?{...u,status}:u));
  const verifyProducer = (id) => { setUsers(us => us.map(u=>u.id===id?{...u,verified:true}:u)); notify(id,"sistema","¡Tu finca fue verificada! Ya puedes publicar productos."); pushToast("Productor verificado", "✅"); };
  const requestVerification = () => notify(currentUser.id,"sistema","Tu solicitud de verificación fue enviada y está en revisión.");
  const deleteUser = (id) => { setUsers(us => us.filter(u=>u.id!==id)); pushToast("Usuario eliminado", "🗑️"); };
  const toggleProductActive = (id) => setProducts(ps => ps.map(p=>p.id===id?{...p,active:!p.active}:p));
  const deleteReview = (id) => { setReviews(rs => rs.filter(r=>r.id!==id)); pushToast("Reseña eliminada", "🗑️"); };

  const myNotifications = currentUser ? notifications.filter(n=>n.userId===currentUser.id) : [];
  const unreadCount = myNotifications.filter(n=>!n.read).length;
  const markAllRead = () => setNotifications(ns => ns.map(n => currentUser && n.userId===currentUser.id ? {...n, read:true} : n));

  const ratingFor = (productId) => {
    const rs = reviews.filter(r=>r.productId===productId);
    if(!rs.length) return 0;
    return rs.reduce((s,r)=>s+r.rating,0)/rs.length;
  };

  /* ---- Filtering / search ---- */
  const filteredProducts = useMemo(() => {
    let list = products.filter(p=>p.active!==false);
    if(query.trim()) list = list.filter(p => p.name.toLowerCase().includes(query.toLowerCase()) || p.cat.toLowerCase().includes(query.toLowerCase()));
    if(filters.cats.length) list = list.filter(p => filters.cats.includes(p.cat));
    if(filters.min) list = list.filter(p => p.price >= Number(filters.min));
    if(filters.max) list = list.filter(p => p.price <= Number(filters.max));
    if(filters.onlyAvailable) list = list.filter(p => p.stock > 0);
    const withRating = list.map(p=>({...p, _rating: ratingFor(p.id)}));
    switch(filters.sort){
      case "precio_asc": withRating.sort((a,b)=>a.price-b.price); break;
      case "precio_desc": withRating.sort((a,b)=>b.price-a.price); break;
      case "disponibilidad": withRating.sort((a,b)=>b.stock-a.stock); break;
      case "cercania": withRating.sort((a,b)=> (a.origin===currentUser?.location?-1:1) - (b.origin===currentUser?.location?-1:1)); break;
      default: withRating.sort((a,b)=>b._rating-a._rating);
    }
    return withRating;
  }, [products, query, filters, reviews, currentUser]);

  const toggleCatFilter = (cat) => setFilters(f => ({...f, cats: f.cats.includes(cat) ? f.cats.filter(c=>c!==cat) : [...f.cats, cat]}));

  const myOrders = currentUser ? orders.filter(o=>o.buyerId===currentUser.id) : [];
  const myProducts = currentUser ? products.filter(p=>p.producerId===currentUser.id) : [];
  const myIncomingOrders = currentUser ? orders.filter(o=>o.items.some(i=>i.producerId===currentUser.id)) : [];
  const myProductReviews = currentUser ? reviews.filter(r => products.find(p=>p.id===r.productId && p.producerId===currentUser.id)) : [];

  return (
    <div>
      <Nav
        currentUser={currentUser} goto={goto} query={query} setQuery={setQuery}
        cartCount={cart.reduce((s,i)=>s+i.qty,0)} setCartOpen={setCartOpen}
        unreadCount={unreadCount} userMenuOpen={userMenuOpen} setUserMenuOpen={setUserMenuOpen}
        setAuthOpen={setAuthOpen} setAuthTab={setAuthTab} logout={logout}
      />

      {view==="home" && <Home goto={goto} query={query} setQuery={setQuery} products={products} />}

      {view==="catalog" && (
        <Catalog
          products={filteredProducts} filters={filters} setFilters={setFilters} toggleCatFilter={toggleCatFilter}
          query={query} setQuery={setQuery} setActiveProduct={setActiveProduct} ratingFor={ratingFor}
          users={users}
        />
      )}

      {view==="orders" && currentUser && (
        <Orders orders={myOrders} products={products} cancelOrder={cancelOrder} onRate={(pid)=>setActiveProduct(products.find(p=>p.id===pid))}
          reviews={reviews} addReview={addReview} currentUser={currentUser} />
      )}

      {view==="producer" && currentUser && currentUser.role==="productor" && (
        <ProducerDashboard
          currentUser={currentUser} myProducts={myProducts} upsertProduct={upsertProduct} deleteProduct={deleteProduct}
          incomingOrders={myIncomingOrders} advanceOrder={advanceOrder} myProductReviews={myProductReviews}
          replyReview={replyReview} requestVerification={requestVerification} users={users}
        />
      )}

      {view==="admin" && currentUser && currentUser.role==="administrador" && (
        <AdminDashboard
          users={users} setUserStatus={setUserStatus} verifyProducer={verifyProducer} deleteUser={deleteUser}
          products={products} toggleProductActive={toggleProductActive} reviews={reviews} deleteReview={deleteReview}
          orders={orders}
        />
      )}

      {view==="profile" && currentUser && (
        <Profile currentUser={currentUser} setUsers={setUsers} pushToast={pushToast} />
      )}

      {view==="notifications" && currentUser && (
        <NotificationsView notifications={myNotifications} markAllRead={markAllRead} currentUser={currentUser} setUsers={setUsers} />
      )}

      <TrustStrip />
      <Footer />

      {authOpen && (
        <AuthModal tab={authTab} setTab={setAuthTab} onClose={()=>setAuthOpen(false)} login={login} register={register} quickLogin={quickLogin} users={users} />
      )}

      {activeProduct && (
        <ProductDetail
          product={activeProduct} onClose={()=>setActiveProduct(null)} addToCart={addToCart}
          reviews={reviews.filter(r=>r.productId===activeProduct.id)} ratingFor={ratingFor}
          producer={users.find(u=>u.id===activeProduct.producerId)} currentUser={currentUser}
          myOrders={myOrders} addReview={addReview}
          requireAuth={()=>{setAuthOpen(true); setAuthTab("login");}}
        />
      )}

      {cartOpen && (
        <CartDrawer
          lines={cartLines} setCartQty={setCartQty} removeFromCart={removeFromCart} total={cartTotal}
          onClose={()=>setCartOpen(false)} currentUser={currentUser}
          requireAuth={()=>{setCartOpen(false); setAuthOpen(true); setAuthTab("login");}}
          placeOrder={placeOrder}
        />
      )}

      <div className="toast-wrap">
        {toasts.map(t => <div className="toast" key={t.id}><span>{t.icon}</span><span>{t.msg}</span></div>)}
      </div>
    </div>
  );
}

/* ---------------- Nav ---------------- */
function Nav({currentUser, goto, query, setQuery, cartCount, setCartOpen, unreadCount, userMenuOpen, setUserMenuOpen, setAuthOpen, setAuthTab, logout}){
  return (
    <div className="nav">
      <div className="brand" onClick={()=>goto("home")}>
        <img src={LOGO} alt="AgroClicking" />
        <div className="brand-name">Agro<span>clicking</span></div>
      </div>
      <div className="nav-search">
        <span>🔎</span>
        <input placeholder="Busca tomate, café, queso..." value={query}
          onChange={e=>setQuery(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter") goto("catalog"); }} />
      </div>
      <div className="nav-links">
        <button className="btn btn-ghost btn-sm" onClick={()=>goto("catalog")}>Catálogo</button>
        {currentUser && currentUser.role==="productor" && <button className="btn btn-ghost btn-sm" onClick={()=>goto("producer")}>Mi finca</button>}
        {currentUser && currentUser.role==="administrador" && <button className="btn btn-ghost btn-sm" onClick={()=>goto("admin")}>Administración</button>}
        {currentUser && currentUser.role==="comprador" && <button className="btn btn-ghost btn-sm" onClick={()=>goto("orders")}>Mis pedidos</button>}

        {currentUser && (
          <button className="nav-icon-btn" onClick={()=>goto("notifications")} title="Notificaciones">
            🔔{unreadCount>0 && <span className="badge-count">{unreadCount}</span>}
          </button>
        )}
        {currentUser && currentUser.role==="comprador" && (
          <button className="nav-icon-btn" onClick={()=>setCartOpen(true)} title="Carrito">
            🛒{cartCount>0 && <span className="badge-count">{cartCount}</span>}
          </button>
        )}

        {!currentUser && (
          <>
            <button className="btn btn-outline btn-sm" onClick={()=>{setAuthTab("login"); setAuthOpen(true);}}>Iniciar sesión</button>
            <button className="btn btn-primary btn-sm" onClick={()=>{setAuthTab("register"); setAuthOpen(true);}}>Registrarse</button>
          </>
        )}

        {currentUser && (
          <div style={{position:"relative"}}>
            <div className="user-chip" onClick={()=>setUserMenuOpen(o=>!o)}>
              <div className="avatar-dot">{currentUser.avatar}</div>
              <span style={{fontSize:13, fontWeight:600}}>{currentUser.name.split(" ")[0]}</span>
            </div>
            {userMenuOpen && (
              <div className="dropdown">
                <button onClick={()=>goto("profile")}>👤 Mi perfil</button>
                {currentUser.role==="comprador" && <button onClick={()=>goto("orders")}>📦 Mis pedidos</button>}
                {currentUser.role==="productor" && <button onClick={()=>goto("producer")}>🌾 Mi finca</button>}
                {currentUser.role==="administrador" && <button onClick={()=>goto("admin")}>🛠️ Administración</button>}
                <button onClick={()=>goto("notifications")}>🔔 Notificaciones</button>
                <hr/>
                <button onClick={logout}>🚪 Cerrar sesión</button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- Home ---------------- */
function Home({goto, query, setQuery, products}){
  return (
    <div>
      <div className="hero rows-bg">
        <div className="container hero-inner">
          <div className="hero-copy">
            <div className="eyebrow">Mercado agrícola directo</div>
            <h1>Del campo a tu mesa,<br/><em>con un clic.</em></h1>
            <p className="lead">Conectamos productores locales con compradores. Elige lo que sembraron, cosecharon y empacaron cerca de ti — sin intermediarios.</p>
            <div className="hero-search">
              <input placeholder="¿Qué se te antoja hoy? Ej: aguacate, miel..." value={query}
                onChange={e=>setQuery(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") goto("catalog");}} />
              <button className="btn btn-accent" onClick={()=>goto("catalog")}>Buscar</button>
            </div>
            <div className="stat-strip">
              <div className="stat-tag"><b>{products.length}+</b><span>productos publicados</span></div>
              <div className="stat-tag"><b>4</b><span>fincas verificadas</span></div>
              <div className="stat-tag"><b>&lt;2s</b><span>tiempo de búsqueda</span></div>
            </div>
          </div>
          <div className="hero-logo-wrap"><img src={LOGO} alt="AgroClicking" /></div>
        </div>
      </div>

      <div className="container section">
        <div className="section-head"><h2>Cómo funciona</h2></div>
        <div className="steps">
          <div className="step-card"><div className="step-num">1</div><h4>Explora el catálogo</h4><p style={{marginTop:8, fontSize:13.5, color:"var(--ink-soft)"}}>Filtra por categoría, precio o cercanía y encuentra productos frescos de fincas reales.</p></div>
          <div className="step-card"><div className="step-num">2</div><h4>Agrega y paga seguro</h4><p style={{marginTop:8, fontSize:13.5, color:"var(--ink-soft)"}}>Arma tu pedido con productos de uno o varios productores y paga como prefieras.</p></div>
          <div className="step-card"><div className="step-num">3</div><h4>Recibe y califica</h4><p style={{marginTop:8, fontSize:13.5, color:"var(--ink-soft)"}}>Sigue tu pedido en tiempo real y deja tu reseña para ayudar a otros compradores.</p></div>
        </div>
      </div>

      <div className="container section" style={{paddingTop:0}}>
        <div className="section-head">
          <h2>Recién publicado</h2>
          <button className="btn btn-outline btn-sm" onClick={()=>goto("catalog")}>Ver todo el catálogo →</button>
        </div>
        <div className="catalog-grid">
          {products.slice(0,4).map(p => (
            <div className="p-card" key={p.id} onClick={()=>goto("catalog")}>
              <ProductVisual product={p} />
              <div className="p-body">
                <span className="p-cat">{p.cat}</span>
                <span className="p-name">{p.name}</span>
                <span className="p-meta">{p.origin} · por {p.unit}</span>
                <div className="p-foot"><StockPill stock={p.stock} /></div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Catalog ---------------- */
function Catalog({products, filters, setFilters, toggleCatFilter, query, setQuery, setActiveProduct, ratingFor, users}){
  return (
    <div className="container section">
      <div className="section-head">
        <div>
          <div className="eyebrow">Catálogo</div>
          <h2>{products.length} productos disponibles</h2>
        </div>
        <select value={filters.sort} onChange={e=>setFilters(f=>({...f, sort:e.target.value}))} style={{padding:"9px 12px", borderRadius:8, border:"1.5px solid var(--line)"}}>
          <option value="popularidad">Ordenar: Popularidad</option>
          <option value="precio_asc">Precio: menor a mayor</option>
          <option value="precio_desc">Precio: mayor a menor</option>
          <option value="cercania">Cercanía</option>
          <option value="disponibilidad">Disponibilidad</option>
        </select>
      </div>
      <div className="catalog-layout">
        <div className="filters">
          <h4>Buscar</h4>
          <input placeholder="Nombre del producto" value={query} onChange={e=>setQuery(e.target.value)}
            style={{width:"100%", padding:"8px 10px", border:"1.5px solid var(--line)", borderRadius:8, marginBottom:18}} />
          <div className="filter-group">
            <h4>Categoría</h4>
            {CATS.map(c => (
              <label className="filter-chip" key={c}>
                <input type="checkbox" checked={filters.cats.includes(c)} onChange={()=>toggleCatFilter(c)} /> {c}
              </label>
            ))}
          </div>
          <div className="filter-group">
            <h4>Precio (COP)</h4>
            <div className="range-row">
              <input placeholder="Min" type="number" value={filters.min} onChange={e=>setFilters(f=>({...f,min:e.target.value}))} />
              <span>–</span>
              <input placeholder="Max" type="number" value={filters.max} onChange={e=>setFilters(f=>({...f,max:e.target.value}))} />
            </div>
          </div>
          <div className="filter-group">
            <label className="filter-chip">
              <input type="checkbox" checked={filters.onlyAvailable} onChange={e=>setFilters(f=>({...f,onlyAvailable:e.target.checked}))} /> Solo disponibles
            </label>
          </div>
          <button className="btn btn-ghost btn-sm btn-block" onClick={()=>setFilters({cats:[],min:"",max:"",onlyAvailable:false,sort:"popularidad"})}>Limpiar filtros</button>
        </div>

        <div className="catalog-grid">
          {products.length===0 && (
            <div className="empty-state" style={{gridColumn:"1/-1"}}>
              <div className="icon">🌱</div>
              <p>No encontramos productos con esos filtros. Intenta ajustarlos.</p>
            </div>
          )}
          {products.map(p => {
            const producer = users.find(u=>u.id===p.producerId);
            return (
              <div className="p-card" key={p.id} onClick={()=>setActiveProduct(p)}>
                <ProductVisual product={p} />
                <div className="p-body">
                  <span className="p-cat">{p.cat}</span>
                  <span className="p-name">{p.name}</span>
                  <span className="p-meta">{producer ? producer.finca || producer.name : ""} · {p.origin}</span>
                  <Stars value={p._rating} />
                  <div className="p-foot"><StockPill stock={p.stock} /><span style={{fontSize:11.5, color:"var(--ink-soft)"}}>por {p.unit}</span></div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Product Detail ---------------- */
function ProductDetail({product, onClose, addToCart, reviews, ratingFor, producer, currentUser, myOrders, addReview, requireAuth}){
  const [qty, setQty] = useState(1);
  const avg = ratingFor(product.id);
  const canBuy = currentUser && currentUser.role==="comprador";
  return (
    <Modal title={product.name} onClose={onClose} lg>
      <div style={{display:"flex", gap:22, flexWrap:"wrap"}}>
        <div style={{flex:"0 0 220px", height:200, borderRadius:12, background: PRODUCT_IMAGES[product.id] ? ("center/cover no-repeat url("+PRODUCT_IMAGES[product.id]+")") : "var(--leaf-light)", display:"flex", alignItems:"center", justifyContent:"center", fontSize: PRODUCT_IMAGES[product.id] ? 0 : 90}}>
          {!PRODUCT_IMAGES[product.id] && product.emoji}
        </div>
        <div style={{flex:1, minWidth:240}}>
          <span className="p-cat">{product.cat}</span>
          <h3 style={{margin:"4px 0 6px"}}>{product.name}</h3>
          <div style={{display:"flex", alignItems:"center", gap:8, marginBottom:8}}>
            <Stars value={avg} /> <span style={{fontSize:12.5, color:"var(--ink-soft)"}}>({reviews.length} reseñas)</span>
          </div>
          <p style={{fontSize:13.5, color:"var(--ink-soft)", marginBottom:12}}>{product.desc}</p>
          <p style={{fontSize:13, marginBottom:4}}><b>Productor:</b> {producer ? producer.finca || producer.name : "—"} {producer && producer.verified && <span className="badge badge-verified">✓ Verificado</span>}</p>
          <p style={{fontSize:13, marginBottom:4}}><b>Origen:</b> {product.origin}</p>
          <p style={{fontSize:13, marginBottom:14}}><b>Disponibilidad:</b> <StockPill stock={product.stock} /></p>
          <div style={{fontFamily:"var(--font-mono)", fontSize:22, fontWeight:800, color:"var(--forest)", marginBottom:14}}>{fmtCOP(product.price)} <span style={{fontSize:12, color:"var(--ink-soft)", fontWeight:400}}>/ {product.unit}</span></div>

          {product.stock>0 ? (
            <div style={{display:"flex", gap:10, alignItems:"center"}}>
              <input type="number" min="1" max={product.stock} value={qty} onChange={e=>setQty(Math.max(1,Math.min(product.stock, Number(e.target.value)||1)))} style={{width:70, padding:"9px 10px", border:"1.5px solid var(--line)", borderRadius:8}} />
              <button className="btn btn-primary" onClick={()=>{ if(!canBuy){ requireAuth(); return;} addToCart(product.id, qty); }}>
                {canBuy ? "Agregar al carrito" : (currentUser ? "Inicia como comprador" : "Inicia sesión para comprar")}
              </button>
            </div>
          ) : <span className="badge badge-blocked">Sin stock disponible por ahora</span>}
        </div>
      </div>

      <div style={{marginTop:26, borderTop:"1px solid var(--line)", paddingTop:16}}>
        <h4 style={{marginBottom:10, fontSize:15}}>Reseñas de compradores</h4>
        {reviews.length===0 && <p style={{fontSize:13, color:"var(--ink-soft)"}}>Aún no hay reseñas para este producto.</p>}
        {reviews.map(r => (
          <div className="review-item" key={r.id}>
            <div style={{display:"flex", justifyContent:"space-between"}}>
              <b style={{fontSize:13}}>{r.buyerName}</b>
              <span style={{fontSize:11.5, color:"var(--ink-soft)"}}>{timeAgo(r.createdAt)}</span>
            </div>
            <Stars value={r.rating} />
            <p style={{fontSize:13, marginTop:4}}>{r.comment}</p>
            {r.reply && <div className="reply-box"><b>Respuesta del productor:</b> {r.reply}</div>}
          </div>
        ))}
      </div>
    </Modal>
  );
}

/* ---------------- Cart Drawer ---------------- */
function CartDrawer({lines, setCartQty, removeFromCart, total, onClose, currentUser, requireAuth, placeOrder}){
  const [step, setStep] = useState("cart");
  const [payment, setPayment] = useState("tarjeta");
  const [location, setLocation] = useState(currentUser ? currentUser.location : "");
  const [lastOrder, setLastOrder] = useState(null);

  const byProducer = {};
  lines.forEach(l => { const key=l.product.producerId; (byProducer[key] = byProducer[key]||[]).push(l); });

  return (
    <React.Fragment>
      <div className="drawer-overlay" onClick={onClose}></div>
      <div className="drawer">
        <div className="drawer-head">
          <h3>{step==="cart" ? "Tu carrito" : step==="checkout" ? "Confirmar pedido" : "¡Pedido creado!"}</h3>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="drawer-body">
          {step==="cart" && (
            lines.length===0 ? (
              <div className="empty-state"><div className="icon">🛒</div><p>Tu carrito está vacío. ¡Explora el catálogo!</p></div>
            ) : Object.entries(byProducer).map(([pid, group]) => (
              <div key={pid} style={{marginBottom:18}}>
                <div className="eyebrow" style={{marginBottom:8}}>{group[0].product.origin}</div>
                {group.map(l => (
                  <div key={l.productId} style={{display:"flex", gap:10, alignItems:"center", marginBottom:12}}>
                    <div style={{fontSize:28}}>{l.product.emoji}</div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700, fontSize:13.5}}>{l.product.name}</div>
                      <div style={{fontSize:12, color:"var(--ink-soft)"}}>{fmtCOP(l.product.price)} / {l.product.unit}</div>
                    </div>
                    <input type="number" min="1" max={l.product.stock} value={l.qty} style={{width:54, padding:"6px 8px", border:"1.5px solid var(--line)", borderRadius:6}}
                      onChange={e=>setCartQty(l.productId, Math.max(0,Math.min(l.product.stock, Number(e.target.value)||0)))} />
                    <button className="btn btn-ghost btn-sm" onClick={()=>removeFromCart(l.productId)}>✕</button>
                  </div>
                ))}
              </div>
            ))
          )}

          {step==="checkout" && (
            <div>
              <div className="field">
                <label>Dirección de entrega</label>
                <input value={location} onChange={e=>setLocation(e.target.value)} placeholder="Barrio, ciudad" />
              </div>
              <div className="field">
                <label>Método de pago</label>
                {[["tarjeta","💳 Tarjeta de crédito/débito"],["pse","🏦 PSE"],["billetera","📱 Billetera digital"],["contraentrega","💵 Pago contra entrega"]].map(([val,lab]) => (
                  <label className="filter-chip" key={val}><input type="radio" name="pay" checked={payment===val} onChange={()=>setPayment(val)} /> {lab}</label>
                ))}
              </div>
              <div className="card" style={{background:"var(--cream)"}}>
                {lines.map(l => (
                  <div key={l.productId} style={{display:"flex", justifyContent:"space-between", fontSize:12.5, marginBottom:4}}>
                    <span>{l.qty} × {l.product.name}</span><span>{fmtCOP(l.qty*l.product.price)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {step==="done" && lastOrder && (
            <div>
              <div className="empty-state" style={{padding:"20px 0"}}>
                <div className="icon">📦</div>
                <p><b>Pedido {lastOrder.id}</b></p>
                <p style={{fontSize:12.5}}>Comprobante electrónico generado</p>
              </div>
              <div className="card">
                <div className="eyebrow" style={{marginBottom:8}}>Factura</div>
                {lastOrder.items.map((i,idx) => (
                  <div key={idx} style={{display:"flex", justifyContent:"space-between", fontSize:12.5, marginBottom:4}}>
                    <span>{i.qty} × {i.name}</span><span>{fmtCOP(i.qty*i.price)}</span>
                  </div>
                ))}
                <hr style={{border:"none", borderTop:"1px dashed var(--line)", margin:"8px 0"}} />
                <div style={{display:"flex", justifyContent:"space-between", fontWeight:800}}><span>Total</span><span>{fmtCOP(lastOrder.total)}</span></div>
                <p style={{fontSize:11.5, color:"var(--ink-soft)", marginTop:8}}>Pago: {lastOrder.paymentMethod} · Entrega en: {lastOrder.location}</p>
              </div>
            </div>
          )}
        </div>
        <div className="drawer-foot">
          {step==="cart" && lines.length>0 && (
            <>
              <div style={{display:"flex", justifyContent:"space-between", marginBottom:10, fontWeight:800}}><span>Subtotal</span><span>{fmtCOP(total)}</span></div>
              <button className="btn btn-primary btn-block" onClick={()=>{ if(!currentUser){requireAuth(); return;} setStep("checkout"); }}>Continuar al pago</button>
            </>
          )}
          {step==="checkout" && (
            <div style={{display:"flex", gap:8}}>
              <button className="btn btn-ghost" onClick={()=>setStep("cart")}>← Volver</button>
              <button className="btn btn-primary btn-block" disabled={!location.trim()} onClick={()=>{ const o = placeOrder(payment, location); setLastOrder(o); setStep("done"); }}>Confirmar pedido · {fmtCOP(total)}</button>
            </div>
          )}
          {step==="done" && <button className="btn btn-primary btn-block" onClick={onClose}>Seguir comprando</button>}
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---------------- Auth Modal ---------------- */
function AuthModal({tab, setTab, onClose, login, register, quickLogin, users}){
  const [email, setEmail] = useState(""); const [password, setPassword] = useState("");
  const [error, setError] = useState(""); const [recovering, setRecovering] = useState(false);
  const [reg, setReg] = useState({role:"comprador", name:"", email:"", password:"", location:"", finca:""});

  const doLogin = () => { const e = login(email, password); if(e) setError(e); };
  const doRegister = () => {
    if(!reg.name || !reg.email || !reg.password || !reg.location || (reg.role==="productor" && !reg.finca)){ setError("Completa todos los campos."); return; }
    const e = register(reg); if(e) setError(e);
  };

  return (
    <Modal title="Bienvenido a AgroClicking" onClose={onClose}>
      <div className="tabs">
        <button className={"tab-btn " + (tab==="login"?"active":"")} onClick={()=>{setTab("login"); setError("");}}>Iniciar sesión</button>
        <button className={"tab-btn " + (tab==="register"?"active":"")} onClick={()=>{setTab("register"); setError("");}}>Crear cuenta</button>
      </div>

      {tab==="login" && !recovering && (
        <div>
          <div className="field"><label>Correo electrónico</label><input value={email} onChange={e=>setEmail(e.target.value)} placeholder="tucorreo@ejemplo.com" /></div>
          <div className="field"><label>Contraseña</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} /></div>
          {error && <p style={{color:"var(--clay)", fontSize:12.5, marginBottom:10}}>{error}</p>}
          <button className="btn btn-primary btn-block" onClick={doLogin}>Iniciar sesión</button>
          <p style={{textAlign:"center", marginTop:10}}><a href="#" style={{fontSize:12.5, color:"var(--leaf)"}} onClick={(e)=>{e.preventDefault(); setRecovering(true);}}>¿Olvidaste tu contraseña?</a></p>
          <p style={{fontSize:11.5, color:"var(--ink-soft)", textAlign:"center", margin:"14px 0 6px"}}>— o entra rápido con una cuenta demo —</p>
          <div style={{display:"flex", gap:6, flexWrap:"wrap", justifyContent:"center"}}>
            <button className="btn btn-outline btn-sm" onClick={()=>quickLogin("comprador@agroclicking.com")}>🙋 Comprador</button>
            <button className="btn btn-outline btn-sm" onClick={()=>quickLogin("finca.esperanza@agroclicking.com")}>🌾 Productor</button>
            <button className="btn btn-outline btn-sm" onClick={()=>quickLogin("admin@agroclicking.com")}>🛠️ Admin</button>
          </div>
        </div>
      )}

      {tab==="login" && recovering && (
        <div>
          <p style={{fontSize:13.5, marginBottom:14}}>Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
          <div className="field"><label>Correo electrónico</label><input value={email} onChange={e=>setEmail(e.target.value)} /></div>
          <button className="btn btn-primary btn-block" onClick={()=>{ pushRecovery(); }}>Enviar enlace</button>
          <button className="btn btn-ghost btn-block" style={{marginTop:8}} onClick={()=>setRecovering(false)}>← Volver a inicio de sesión</button>
        </div>
      )}

      {tab==="register" && (
        <div>
          <div className="field">
            <label>Quiero registrarme como</label>
            <div className="role-pick">
              <div className={"role-opt " + (reg.role==="comprador"?"active":"")} onClick={()=>setReg(r=>({...r,role:"comprador"}))}>🙋 Comprador</div>
              <div className={"role-opt " + (reg.role==="productor"?"active":"")} onClick={()=>setReg(r=>({...r,role:"productor"}))}>🌾 Productor</div>
            </div>
          </div>
          <div className="field"><label>Nombre completo</label><input value={reg.name} onChange={e=>setReg(r=>({...r,name:e.target.value}))} /></div>
          {reg.role==="productor" && <div className="field"><label>Nombre de la finca</label><input value={reg.finca} onChange={e=>setReg(r=>({...r,finca:e.target.value}))} /></div>}
          <div className="field-row">
            <div className="field"><label>Correo electrónico</label><input value={reg.email} onChange={e=>setReg(r=>({...r,email:e.target.value}))} /></div>
            <div className="field"><label>Contraseña</label><input type="password" value={reg.password} onChange={e=>setReg(r=>({...r,password:e.target.value}))} /></div>
          </div>
          <div className="field"><label>Ubicación</label><input value={reg.location} onChange={e=>setReg(r=>({...r,location:e.target.value}))} placeholder="Ciudad / Departamento" /></div>
          {error && <p style={{color:"var(--clay)", fontSize:12.5, marginBottom:10}}>{error}</p>}
          <button className="btn btn-primary btn-block" onClick={doRegister}>Crear cuenta</button>
        </div>
      )}
    </Modal>
  );

  function pushRecovery(){ setError(""); alert("Si el correo existe en AgroClicking, enviamos un enlace de recuperación (simulado)."); setRecovering(false); }
}

/* ---------------- Orders (buyer) ---------------- */
function Orders({orders, products, cancelOrder, reviews, addReview, currentUser}){
  const [rateFor, setRateFor] = useState(null);
  const [stars, setStars] = useState(5); const [comment, setComment] = useState("");

  const hasReviewed = (productId) => reviews.some(r=>r.productId===productId && r.buyerId===currentUser.id);

  return (
    <div className="container section">
      <div className="section-head"><div><div className="eyebrow">Historial</div><h2>Mis pedidos</h2></div></div>
      {orders.length===0 && <div className="empty-state"><div className="icon">📦</div><p>Aún no has hecho pedidos.</p></div>}
      {orders.map(o => (
        <div className="card" key={o.id} style={{marginBottom:16}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8}}>
            <div>
              <b style={{fontFamily:"var(--font-mono)"}}>{o.id}</b>
              <span style={{fontSize:12, color:"var(--ink-soft)", marginLeft:10}}>{timeAgo(o.createdAt)}</span>
            </div>
            <span className={"status-pill status-" + o.status}>{STATUS_LABEL[o.status]}</span>
          </div>
          <div style={{display:"flex", gap:6, margin:"12px 0"}}>
            {STATUS_FLOW.map((s,idx) => {
              const active = o.status!=="cancelado" && STATUS_FLOW.indexOf(o.status) >= idx;
              return <div key={s} style={{flex:1, height:5, borderRadius:3, background: o.status==="cancelado" ? "var(--clay-light)" : (active ? "var(--leaf)" : "var(--line)")}}></div>;
            })}
          </div>
          {o.items.map((i,idx) => {
            const prod = products.find(p=>p.id===i.productId);
            return (
              <div key={idx} style={{display:"flex", justifyContent:"space-between", alignItems:"center", fontSize:13, padding:"6px 0", borderBottom:"1px solid var(--line)"}}>
                <span>{i.qty} × {i.name}</span>
                <div style={{display:"flex", alignItems:"center", gap:10}}>
                  <span>{fmtCOP(i.qty*i.price)}</span>
                  {o.status==="entregado" && prod && !hasReviewed(prod.id) && (
                    <button className="btn btn-outline btn-sm" onClick={()=>setRateFor(prod)}>Calificar</button>
                  )}
                </div>
              </div>
            );
          })}
          <div style={{display:"flex", justifyContent:"space-between", marginTop:10}}>
            <span style={{fontWeight:800}}>Total {fmtCOP(o.total)}</span>
            {o.status==="pendiente" && <button className="btn btn-danger btn-sm" onClick={()=>cancelOrder(o.id)}>Cancelar pedido</button>}
          </div>
        </div>
      ))}

      {rateFor && (
        <Modal title={"Calificar " + rateFor.name} onClose={()=>setRateFor(null)}>
          <div className="field">
            <label>Calificación</label>
            <div style={{display:"flex", gap:4, fontSize:26}}>
              {[1,2,3,4,5].map(n => <span key={n} style={{cursor:"pointer", color: n<=stars ? "var(--harvest)" : "var(--line)"}} onClick={()=>setStars(n)}>★</span>)}
            </div>
          </div>
          <div className="field"><label>Comentario</label><textarea rows="3" value={comment} onChange={e=>setComment(e.target.value)} placeholder="Cuéntanos tu experiencia..." /></div>
          <button className="btn btn-primary btn-block" onClick={()=>{ addReview(rateFor.id, stars, comment); setRateFor(null); setStars(5); setComment(""); }}>Enviar reseña</button>
        </Modal>
      )}
    </div>
  );
}

/* ---------------- Producer dashboard ---------------- */
function ProducerDashboard({currentUser, myProducts, upsertProduct, deleteProduct, incomingOrders, advanceOrder, myProductReviews, replyReview, requestVerification, users}){
  const [tab, setTab] = useState("productos");
  const [editing, setEditing] = useState(null);
  const [replyDraft, setReplyDraft] = useState({});

  return (
    <div className="container section">
      <div className="section-head">
        <div>
          <div className="eyebrow">Panel de productor</div>
          <h2>{currentUser.finca} {currentUser.verified ? <span className="badge badge-verified">✓ Verificada</span> : <span className="badge badge-pending">Verificación pendiente</span>}</h2>
        </div>
        {!currentUser.verified && <button className="btn btn-accent btn-sm" onClick={requestVerification}>Solicitar verificación</button>}
      </div>

      <div className="tabs">
        <button className={"tab-btn " + (tab==="productos"?"active":"")} onClick={()=>setTab("productos")}>Mis productos ({myProducts.length})</button>
        <button className={"tab-btn " + (tab==="pedidos"?"active":"")} onClick={()=>setTab("pedidos")}>Pedidos recibidos ({incomingOrders.length})</button>
        <button className={"tab-btn " + (tab==="reseñas"?"active":"")} onClick={()=>setTab("reseñas")}>Reseñas ({myProductReviews.length})</button>
      </div>

      {tab==="productos" && (
        <div>
          <button className="btn btn-primary btn-sm" style={{marginBottom:16}} onClick={()=>setEditing({})}>+ Publicar nuevo producto</button>
          <div className="catalog-grid">
            {myProducts.map(p => (
              <div className="p-card" key={p.id} style={{cursor:"default"}}>
                <ProductVisual product={p} />
                <div className="p-body">
                  <span className="p-cat">{p.cat}{p.active===false && " · Oculto"}</span>
                  <span className="p-name">{p.name}</span>
                  <span className="p-meta">Stock: {p.stock} {p.unit}</span>
                  <div style={{display:"flex", gap:6, marginTop:6}}>
                    <button className="btn btn-outline btn-sm" onClick={()=>setEditing(p)}>Editar</button>
                    <button className="btn btn-danger btn-sm" onClick={()=>deleteProduct(p.id)}>Eliminar</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
          {myProducts.length===0 && <div className="empty-state"><div className="icon">🌱</div><p>Aún no has publicado productos.</p></div>}
        </div>
      )}

      {tab==="pedidos" && (
        <div>
          {incomingOrders.length===0 && <div className="empty-state"><div className="icon">📭</div><p>Todavía no has recibido pedidos.</p></div>}
          {incomingOrders.map(o => {
            const myItems = o.items.filter(i=>i.producerId===currentUser.id);
            const idx = STATUS_FLOW.indexOf(o.status);
            const next = STATUS_FLOW[idx+1];
            return (
              <div className="card" key={o.id} style={{marginBottom:14}}>
                <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                  <b style={{fontFamily:"var(--font-mono)"}}>{o.id}</b>
                  <span className={"status-pill status-" + o.status}>{STATUS_LABEL[o.status]}</span>
                </div>
                {myItems.map((i,ix)=>(<div key={ix} style={{fontSize:13, padding:"4px 0"}}>{i.qty} × {i.name} — {fmtCOP(i.qty*i.price)}</div>))}
                {next && o.status!=="cancelado" && (
                  <button className="btn btn-primary btn-sm" style={{marginTop:8}} onClick={()=>advanceOrder(o.id)}>
                    {next==="confirmado" ? "Confirmar pedido" : next==="en_camino" ? "Marcar en camino" : "Marcar entregado"}
                  </button>
                )}
              </div>
            );
          })}
        </div>
      )}

      {tab==="reseñas" && (
        <div>
          {myProductReviews.length===0 && <div className="empty-state"><div className="icon">💬</div><p>Aún no tienes reseñas.</p></div>}
          {myProductReviews.map(r => (
            <div className="card" key={r.id} style={{marginBottom:12}}>
              <div style={{display:"flex", justifyContent:"space-between"}}><b>{r.buyerName}</b><Stars value={r.rating} /></div>
              <p style={{fontSize:13, margin:"6px 0"}}>{r.comment}</p>
              {r.reply ? <div className="reply-box"><b>Tu respuesta:</b> {r.reply}</div> : (
                <div style={{display:"flex", gap:6, marginTop:6}}>
                  <input placeholder="Responder a esta reseña..." value={replyDraft[r.id]||""} onChange={e=>setReplyDraft(d=>({...d,[r.id]:e.target.value}))} style={{flex:1, padding:"7px 10px", border:"1.5px solid var(--line)", borderRadius:6}} />
                  <button className="btn btn-outline btn-sm" onClick={()=>replyReview(r.id, replyDraft[r.id]||"")}>Responder</button>
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {editing && <ProductForm initial={editing} onClose={()=>setEditing(null)} onSave={(data)=>{upsertProduct(data); setEditing(null);}} />}
    </div>
  );
}

function ProductForm({initial, onClose, onSave}){
  const [data, setData] = useState({
    id: initial.id, name: initial.name||"", cat: initial.cat||CATS[0], price: initial.price||"", unit: initial.unit||"kg",
    stock: initial.stock||"", origin: initial.origin||"", emoji: initial.emoji||"🥦", desc: initial.desc||""
  });
  const set = (k,v) => setData(d=>({...d,[k]:v}));
  return (
    <Modal title={initial.id ? "Editar producto" : "Nuevo producto"} onClose={onClose}>
      <div className="field"><label>Nombre</label><input value={data.name} onChange={e=>set("name",e.target.value)} /></div>
      <div className="field-row">
        <div className="field"><label>Categoría</label>
          <select value={data.cat} onChange={e=>set("cat",e.target.value)}>{CATS.map(c=><option key={c}>{c}</option>)}</select>
        </div>
        <div className="field"><label>Ícono</label><input value={data.emoji} onChange={e=>set("emoji",e.target.value)} /></div>
      </div>
      <div className="field-row">
        <div className="field"><label>Precio (COP)</label><input type="number" value={data.price} onChange={e=>set("price",e.target.value)} /></div>
        <div className="field"><label>Unidad</label><input value={data.unit} onChange={e=>set("unit",e.target.value)} placeholder="kg, litro, unidad..." /></div>
      </div>
      <div className="field-row">
        <div className="field"><label>Cantidad disponible</label><input type="number" value={data.stock} onChange={e=>set("stock",e.target.value)} /></div>
        <div className="field"><label>Ubicación de origen</label><input value={data.origin} onChange={e=>set("origin",e.target.value)} /></div>
      </div>
      <div className="field"><label>Descripción</label><textarea rows="3" value={data.desc} onChange={e=>set("desc",e.target.value)} /></div>
      <button className="btn btn-primary btn-block" onClick={()=>onSave(data)}>Guardar producto</button>
    </Modal>
  );
}

/* ---------------- Admin dashboard ---------------- */
function AdminDashboard({users, setUserStatus, verifyProducer, deleteUser, products, toggleProductActive, reviews, deleteReview, orders}){
  const [tab, setTab] = useState("usuarios");

  const activeSales = orders.filter(o=>o.status!=="cancelado");
  const totalSales = activeSales.reduce((s,o)=>s+o.total,0);
  const activeUsers = users.filter(u=>u.status==="activo").length;
  const salesByProduct = {};
  activeSales.forEach(o => o.items.forEach(i => { salesByProduct[i.name] = (salesByProduct[i.name]||0) + i.qty; }));
  const topProducts = Object.entries(salesByProduct).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxTop = Math.max(1, ...topProducts.map(t=>t[1]));

  return (
    <div className="container section">
      <div className="section-head"><div><div className="eyebrow">Panel de administración</div><h2>Gestión de la plataforma</h2></div></div>
      <div className="tabs">
        <button className={"tab-btn " + (tab==="usuarios"?"active":"")} onClick={()=>setTab("usuarios")}>Usuarios</button>
        <button className={"tab-btn " + (tab==="moderacion"?"active":"")} onClick={()=>setTab("moderacion")}>Moderación</button>
        <button className={"tab-btn " + (tab==="reportes"?"active":"")} onClick={()=>setTab("reportes")}>Reportes</button>
      </div>

      {tab==="usuarios" && (
        <table>
          <thead><tr><th>Nombre</th><th>Rol</th><th>Estado</th><th>Ubicación</th><th>Acciones</th></tr></thead>
          <tbody>
            {users.map(u => (
              <tr key={u.id}>
                <td>{u.avatar} {u.name}{u.role==="productor" && (u.verified ? <span className="badge badge-verified" style={{marginLeft:6}}>✓</span> : <span className="badge badge-pending" style={{marginLeft:6}}>pendiente</span>)}</td>
                <td style={{textTransform:"capitalize"}}>{u.role}</td>
                <td>{u.status==="bloqueado" ? <span className="badge badge-blocked">Bloqueado</span> : <span className="badge badge-verified">Activo</span>}</td>
                <td>{u.location}</td>
                <td>
                  <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
                    {u.role==="productor" && !u.verified && <button className="btn btn-outline btn-sm" onClick={()=>verifyProducer(u.id)}>Verificar</button>}
                    {u.role!=="administrador" && (
                      <button className="btn btn-outline btn-sm" onClick={()=>setUserStatus(u.id, u.status==="bloqueado"?"activo":"bloqueado")}>{u.status==="bloqueado" ? "Desbloquear" : "Bloquear"}</button>
                    )}
                    {u.role!=="administrador" && <button className="btn btn-danger btn-sm" onClick={()=>{ if(confirm("¿Eliminar a " + u.name + "?")) deleteUser(u.id); }}>Eliminar</button>}
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {tab==="moderacion" && (
        <div>
          <h4 style={{margin:"10px 0"}}>Publicaciones</h4>
          <table>
            <thead><tr><th>Producto</th><th>Categoría</th><th>Estado</th><th>Acción</th></tr></thead>
            <tbody>
              {products.map(p => (
                <tr key={p.id}>
                  <td>{p.emoji} {p.name}</td><td>{p.cat}</td>
                  <td>{p.active===false ? <span className="badge badge-blocked">Oculto</span> : <span className="badge badge-verified">Visible</span>}</td>
                  <td><button className="btn btn-outline btn-sm" onClick={()=>toggleProductActive(p.id)}>{p.active===false ? "Publicar" : "Ocultar"}</button></td>
                </tr>
              ))}
            </tbody>
          </table>
          <h4 style={{margin:"20px 0 10px"}}>Reseñas</h4>
          <table>
            <thead><tr><th>Autor</th><th>Comentario</th><th>Calificación</th><th>Acción</th></tr></thead>
            <tbody>
              {reviews.map(r => (
                <tr key={r.id}>
                  <td>{r.buyerName}</td><td style={{maxWidth:260}}>{r.comment}</td><td><Stars value={r.rating} /></td>
                  <td><button className="btn btn-danger btn-sm" onClick={()=>deleteReview(r.id)}>Eliminar</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {tab==="reportes" && (
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))", gap:18}}>
          <div className="card">
            <div className="eyebrow">Ventas totales</div>
            <h2 style={{fontSize:30, margin:"6px 0"}}>{fmtCOP(totalSales)}</h2>
            <p style={{fontSize:12.5, color:"var(--ink-soft)"}}>{activeSales.length} pedidos completados o en curso</p>
          </div>
          <div className="card">
            <div className="eyebrow">Usuarios activos</div>
            <h2 style={{fontSize:30, margin:"6px 0"}}>{activeUsers}</h2>
            <p style={{fontSize:12.5, color:"var(--ink-soft)"}}>de {users.length} cuentas registradas</p>
          </div>
          <div className="card" style={{gridColumn:"1/-1"}}>
            <div className="eyebrow" style={{marginBottom:12}}>Productos más vendidos</div>
            {topProducts.length===0 && <p style={{fontSize:13, color:"var(--ink-soft)"}}>Aún no hay ventas registradas.</p>}
            {topProducts.map(([name,qty]) => (
              <div className="bar-row" key={name}>
                <div className="bar-label">{name}</div>
                <div className="bar-track"><div className="bar-fill" style={{width:(qty/maxTop*100)+"%"}}></div></div>
                <div className="bar-val">{qty} und.</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------- Profile ---------------- */
function Profile({currentUser, setUsers, pushToast}){
  const [data, setData] = useState({name:currentUser.name, location:currentUser.location, avatar:currentUser.avatar, finca:currentUser.finca||""});
  const save = () => {
    setUsers(us => us.map(u => u.id===currentUser.id ? {...u, ...data} : u));
    pushToast("Perfil actualizado", "✅");
  };
  return (
    <div className="container section" style={{maxWidth:560}}>
      <div className="eyebrow">Cuenta</div>
      <h2 style={{marginBottom:20}}>Mi perfil</h2>
      <div className="card">
        <div className="field"><label>Foto (emoji)</label><input value={data.avatar} onChange={e=>setData(d=>({...d,avatar:e.target.value}))} /></div>
        <div className="field"><label>Nombre completo</label><input value={data.name} onChange={e=>setData(d=>({...d,name:e.target.value}))} /></div>
        <div className="field"><label>Correo</label><input value={currentUser.email} disabled style={{opacity:0.6}} /></div>
        <div className="field"><label>Ubicación</label><input value={data.location} onChange={e=>setData(d=>({...d,location:e.target.value}))} /></div>
        {currentUser.role==="productor" && (
          <div className="field"><label>Nombre de la finca</label><input value={data.finca} onChange={e=>setData(d=>({...d,finca:e.target.value}))} /></div>
        )}
        {currentUser.role==="productor" && (
          <p style={{fontSize:12.5, marginBottom:14}}>Estado de verificación: {currentUser.verified ? <span className="badge badge-verified">✓ Verificada</span> : <span className="badge badge-pending">Pendiente</span>}</p>
        )}
        <button className="btn btn-primary" onClick={save}>Guardar cambios</button>
      </div>
    </div>
  );
}

/* ---------------- Notifications ---------------- */
function NotificationsView({notifications, markAllRead, currentUser, setUsers}){
  const ICONS = {pedido:"📦", reseña:"⭐", sistema:"🌱"};
  const prefs = currentUser.prefs || {email:true,push:true,sms:false};
  const setPref = (k) => setUsers(us => us.map(u => u.id===currentUser.id ? {...u, prefs:{...u.prefs, [k]:!u.prefs[k]}} : u));
  return (
    <div className="container section">
      <div className="section-head">
        <div><div className="eyebrow">Centro de notificaciones</div><h2>Notificaciones</h2></div>
        <button className="btn btn-outline btn-sm" onClick={markAllRead}>Marcar todas como leídas</button>
      </div>
      <div style={{display:"flex", gap:22, flexWrap:"wrap"}}>
        <div className="card" style={{flex:2, minWidth:280, padding:0}}>
          {notifications.length===0 && <div className="empty-state"><div className="icon">🔔</div><p>No tienes notificaciones todavía.</p></div>}
          {notifications.map(n => (
            <div className={"notif-item" + (n.read?"":" unread")} key={n.id}>
              <div className="notif-ic">{ICONS[n.type]||"🔔"}</div>
              <div><p style={{fontSize:13.5}}>{n.message}</p><span style={{fontSize:11.5, color:"var(--ink-soft)"}}>{timeAgo(n.createdAt)}</span></div>
            </div>
          ))}
        </div>
        <div className="card" style={{flex:1, minWidth:240, height:"fit-content"}}>
          <h4 style={{fontSize:13, marginBottom:12}}>Preferencias de notificación</h4>
          {[["email","Correo electrónico"],["push","Notificaciones push"],["sms","Mensajes SMS"]].map(([k,label]) => (
            <div key={k} style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 0"}}>
              <span style={{fontSize:13}}>{label}</span>
              <div className={"toggle " + (prefs[k]?"on":"")} onClick={()=>setPref(k)}></div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Trust strip + Footer ---------------- */
function TrustStrip(){
  const items = [
    ["🔐","Pagos y datos cifrados","TLS en tránsito y AES-256 en reposo"],
    ["🪪","Acceso por roles","Autenticación JWT/OAuth2 con permisos RBAC"],
    ["🛡️","Buenas prácticas OWASP","Protección contra inyección SQL, XSS y CSRF"],
    ["⏱️","99.5% de disponibilidad","Respaldos automáticos todos los días"],
    ["📈","Arquitectura escalable","Contenedores listos para AWS, GCP o Azure"],
    ["🧾","Facturación electrónica","Comprobantes conforme a normativa fiscal"],
  ];
  return (
    <div className="trust-strip">
      <div className="container">
        <div className="eyebrow" style={{color:"var(--harvest)", marginBottom:16}}>Tecnología en la que puedes confiar</div>
        <div className="trust-grid">
          {items.map(([ic,t,d]) => (
            <div className="trust-item" key={t}><span className="ic">{ic}</span><div><b>{t}</b><span>{d}</span></div></div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Footer(){
  return (
    <footer>
      <div className="container">
        <div style={{display:"flex", alignItems:"center", gap:8}}>
          <img src={LOGO} alt="AgroClicking" style={{width:26, height:26, borderRadius:"50%", objectFit:"cover"}} />
          <span>© 2026 AgroClicking · Del campo a tu mesa, con un clic.</span>
        </div>
        <span>Prototipo funcional con datos de demostración</span>
      </div>
    </footer>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
