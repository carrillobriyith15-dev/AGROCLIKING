    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--forest-dark); letter-spacing:0.2px;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px;}
  a{color:inherit;}
  ::selection{background:var(--harvest-light);}

  .rows-bg{
    background-image: repeating-linear-gradient(112deg, rgba(76,154,42,0.10) 0px, rgba(76,154,42,0.10) 14px, transparent 14px, transparent 30px);
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 18px; border-radius:999px; border:1.5px solid transparent;
    font-weight:700; font-size:14px; transition:transform .12s ease, box-shadow .12s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--leaf); color:#fff;}
  .btn-primary:hover{background:var(--forest);}
  .btn-accent{background:var(--harvest); color:var(--forest-dark);}
  .btn-accent:hover{box-shadow:var(--shadow);}
  .btn-outline{background:transparent; border-color:var(--forest); color:var(--forest);}
  .btn-outline:hover{background:var(--forest); color:#fff;}
  .btn-ghost{background:transparent; color:var(--forest-dark);}
  .btn-ghost:hover{background:var(--leaf-light);}
  .btn-danger{background:var(--clay); color:#fff;}
  .btn-danger:hover{opacity:0.88;}
  .btn-sm{padding:6px 12px; font-size:12.5px;}
  .btn-block{width:100%;}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}

  /* ---------- Nav ---------- */
  .nav{
    position:sticky; top:0; z-index:40; background:var(--paper);
    border-bottom:1px solid var(--line); padding:10px 22px;
    display:flex; align-items:center; gap:18px;
  }
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
  .brand img{width:38px; height:38px; border-radius:50%; object-fit:cover; border:2px solid var(--harvest);}
  .brand-name{font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--forest-dark);}
  .brand-name span{color:var(--harvest);}
  .nav-search{
    flex:1; max-width:480px; display:flex; align-items:center; gap:8px;
    background:var(--cream); border:1.5px solid var(--line); border-radius:999px; padding:7px 14px;
  }
  .nav-search input{border:none; outline:none; background:transparent; flex:1; font-size:13.5px; color:var(--ink);}
  .nav-links{display:flex; align-items:center; gap:6px;}
  .nav-icon-btn{
    position:relative; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--line);
    background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .nav-icon-btn:hover{background:var(--leaf-light);}
  .badge-count{
    position:absolute; top:-4px; right:-4px; background:var(--clay); color:#fff; font-size:10px;
    font-weight:800; border-radius:999px; min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  .user-chip{display:flex; align-items:center; gap:8px; padding:5px 12px 5px 6px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper); position:relative;}
  .avatar-dot{width:26px; height:26px; border-radius:50%; background:var(--leaf-light); display:flex; align-items:center; justify-content:center; font-size:14px;}
  .dropdown{position:absolute; top:46px; right:0; background:var(--paper); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); min-width:200px; padding:6px; z-index:50;}
  .dropdown button{display:block; width:100%; text-align:left; padding:9px 12px; border:none; background:none; border-radius:8px; font-size:13.5px; color:var(--ink);}
  .dropdown button:hover{background:var(--leaf-light);}
  .dropdown hr{border:none; border-top:1px solid var(--line); margin:4px 0;}

  /* ---------- Layout helpers ---------- */
  .container{max-width:1180px; margin:0 auto; padding:0 22px;}
  .section{padding:44px 0;}
  .eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:2px; text-transform:uppercase; color:var(--leaf); font-weight:700;}

  /* ---------- Hero ---------- */
  .hero{
    background: linear-gradient(180deg, var(--forest-dark), var(--forest) 65%);
    color:#fff; padding:56px 0 70px; position:relative; overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(112deg, rgba(255,255,255,0.045) 0px, rgba(255,255,255,0.045) 16px, transparent 16px, transparent 34px);
  }
  .hero-inner{position:relative; display:flex; align-items:center; gap:44px; flex-wrap:wrap;}
  .hero-copy{flex:1; min-width:300px;}
  .hero h1{color:#fff; font-size:44px; line-height:1.08; margin:10px 0 14px;}
  .hero h1 em{font-style:normal; color:var(--harvest);}
  .hero p.lead{color:#DDEBD4; font-size:16px; max-width:480px; margin-bottom:24px;}
  .hero-search{
    background:var(--paper); border-radius:14px; padding:8px; display:flex; gap:8px; max-width:460px;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
  }
  .hero-search input{flex:1; border:none; outline:none; padding:10px 12px; font-size:14px; border-radius:10px;}
  .hero-logo-wrap{
    width:230px; height:230px; border-radius:50%; background:var(--paper);
    display:flex; align-items:center; justify-content:center; box-shadow:0 20px 50px rgba(0,0,0,0.3);
    flex-shrink:0; border:6px solid var(--harvest);
  }
  .hero-logo-wrap img{width:100%; height:100%; object-fit:cover; border-radius:50%;}
  .stat-strip{display:flex; gap:12px; margin-top:30px; flex-wrap:wrap;}
  .stat-tag{
    background:rgba(255,255,255,0.08); border:1px dashed rgba(255,255,255,0.35); border-radius:10px;
    padding:10px 14px; font-family:var(--font-mono);
  }
  .stat-tag b{display:block; font-size:18px; color:var(--harvest);}
  .stat-tag span{font-size:11px; color:#DDEBD4;}

  /* ---------- How it works ---------- */
  .steps{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
  .step-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:22px;}
  .step-num{font-family:var(--font-mono); color:var(--harvest); background:var(--forest-dark); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; margin-bottom:12px;}

  /* ---------- Section headers ---------- */
  .section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}

  /* ---------- Catalog layout ---------- */
  .catalog-layout{display:flex; gap:26px; align-items:flex-start;}
  .filters{
    width:230px; flex-shrink:0; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px; position:sticky; top:76px;
  }
  .filters h4{font-size:13px; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; color:var(--forest);}
  .filter-group{margin-bottom:20px;}
  .filter-chip{display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13.5px; cursor:pointer;}
  .range-row{display:flex; gap:6px; align-items:center;}
  .range-row input{width:70px; padding:6px 8px; border:1px solid var(--line); border-radius:6px;}
  .catalog-grid{flex:1; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:20px;}

  /* ---------- Product card ---------- */
  .p-card{
    background:var(--paper); border:1px solid var(--line); border-radius:14px; overflow:visible; position:relative;
    display:flex; flex-direction:column; transition:transform .15s ease, box-shadow .15s ease; cursor:pointer;
  }
  .p-card:hover{transform:translateY(-3px); box-shadow:var(--shadow);}
  .p-visual{
    height:130px; border-radius:14px 14px 0 0; display:flex; align-items:center; justify-content:center; font-size:52px;
    background:var(--leaf-light); position:relative;
  }
  .p-tag{
    position:absolute; top:-10px; right:10px; background:var(--harvest); color:var(--forest-dark);
    font-family:var(--font-mono); font-weight:800; font-size:13px; padding:6px 10px 5px;
    border-radius:3px; transform:rotate(-4deg); box-shadow:0 4px 10px rgba(0,0,0,0.18);
  }
  .p-tag::after{
    content:""; position:absolute; bottom:-6px; right:8px; width:0; height:0;
    border-left:6px solid transparent; border-right:6px solid transparent; border-top:6px solid #9c7300;
  }
  .p-body{padding:14px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .p-cat{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--leaf);}
  .p-name{font-family:var(--font-display); font-size:16.5px; color:var(--forest-dark); font-weight:700;}
  .p-meta{font-size:12px; color:var(--ink-soft);}
  .p-stars{font-size:12.5px; color:var(--harvest);}
  .p-foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px;}
  .stock-pill{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px;}
  .stock-ok{background:var(--leaf-light); color:var(--forest);}
  .stock-low{background:var(--harvest-light); color:#8a5c00;}
  .stock-out{background:var(--clay-light); color:var(--clay);}

  /* ---------- Badges/pills ---------- */
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;}
  .badge-verified{background:var(--leaf-light); color:var(--forest);}
  .badge-pending{background:var(--harvest-light); color:#8a5c00;}
  .badge-blocked{background:var(--clay-light); color:var(--clay);}
  .status-pill{font-family:var(--font-mono); font-size:11px; font-weight:700; padding:4px 10px; border-radius:6px; text-transform:uppercase; letter-spacing:0.5px;}
  .status-pendiente{background:var(--harvest-light); color:#8a5c00;}
  .status-confirmado{background:#DCEEFB; color:#1B5E8C;}
  .status-en_camino{background:#E5DEFB; color:#5B3FA6;}
  .status-entregado{background:var(--leaf-light); color:var(--forest);}
  .status-cancelado{background:var(--clay-light); color:var(--clay);}

  /* ---------- Modal / Drawer ---------- */
  .overlay{position:fixed; inset:0; background:rgba(18,44,26,0.55); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:var(--paper); border-radius:16px; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 30px 70px rgba(0,0,0,0.35);}
  .modal-lg{max-width:820px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line);}
  .modal-body{padding:22px;}
  .modal-close{background:none; border:none; font-size:20px; color:var(--ink-soft); width:32px; height:32px; border-radius:50%;}
  .modal-close:hover{background:var(--leaf-light);}
  .drawer-overlay{position:fixed; inset:0; background:rgba(18,44,26,0.5); z-index:100;}
  .drawer{position:fixed; top:0; right:0; bottom:0; width:400px; max-width:92vw; background:var(--paper); z-index:101; display:flex; flex-direction:column; box-shadow:-14px 0 40px rgba(0,0,0,0.25);}
  .drawer-head{padding:18px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .drawer-body{flex:1; overflow-y:auto; padding:16px 20px;}
  .drawer-foot{padding:18px 20px; border-top:1px solid var(--line); background:var(--cream);}

  /* ---------- Forms ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--forest); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; background:var(--cream); outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--leaf);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .role-pick{display:flex; gap:10px;}
  .role-opt{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:12px; text-align:center; cursor:pointer; font-size:13px; font-weight:600;}
  .role-opt.active{border-color:var(--leaf); background:var(--leaf-light); color:var(--forest);}
  .tabs{display:flex; gap:4px; border-bottom:1.5px solid var(--line); margin-bottom:18px; overflow-x:auto;}
  .tab-btn{padding:9px 16px; background:none; border:none; font-weight:700; font-size:13.5px; color:var(--ink-soft); border-bottom:3px solid transparent; white-space:nowrap;}
  .tab-btn.active{color:var(--forest); border-color:var(--harvest);}

  /* ---------- Cards / misc ---------- */
  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-soft);}
  .empty-state .icon{font-size:42px; margin-bottom:10px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; padding:10px 8px; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); border-bottom:1.5px solid var(--line);}
  td{padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .bar-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .bar-label{width:150px; font-size:12.5px; flex-shrink:0;}
  .bar-track{flex:1; background:var(--cream); border-radius:6px; height:16px; overflow:hidden; border:1px solid var(--line);}
  .bar-fill{height:100%; background:linear-gradient(90deg,var(--leaf),var(--harvest));}
  .bar-val{width:56px; text-align:right; font-family:var(--font-mono); font-size:12px; flex-shrink:0;}
  .toggle{position:relative; width:40px; height:22px; border-radius:999px; background:var(--line); flex-shrink:0; transition:background .15s;}
  .toggle.on{background:var(--leaf);}
  .toggle::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s;}
  .toggle.on::after{left:20px;}
  .review-item{border-bottom:1px solid var(--line); padding:12px 0;}
  .reply-box{background:var(--cream); border-radius:8px; padding:10px; margin-top:8px; font-size:13px;}

  .toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--forest-dark); color:#fff; padding:12px 18px; border-radius:10px; box-shadow:var(--shadow); font-size:13.5px; display:flex; align-items:center; gap:8px; animation:slideIn .2s ease;}
  @keyframes slideIn{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);}}

  .trust-strip{background:var(--forest-dark); padding:36px 0;}
  .trust-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px;}
  .trust-item{display:flex; gap:10px; align-items:flex-start; color:#DDEBD4;}
  .trust-item .ic{font-size:20px;}
  .trust-item b{display:block; color:#fff; font-size:13px;}
  .trust-item span{font-size:11.5px; color:#B9CDB0;}

  footer{background:var(--forest-dark); color:#B9CDB0; padding:30px 0; font-size:12.5px;}
  footer .container{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}

  .notif-item{display:flex; gap:12px; padding:14px; border-bottom:1px solid var(--line); align-items:flex-start;}
  .notif-item.unread{background:var(--leaf-light);}
  .notif-ic{width:34px; height:34px; border-radius:50%; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

  @media (max-width: 860px){
    .catalog-layout{flex-direction:column;}
    .filters{width:100%; position:static;}
    .hero h1{font-size:32px;}
    .hero-logo-wrap{width:150px; height:150px;}
    .steps{grid-template-columns:1fr;}
    .nav-search{display:none;}
  }
</style>
</head>

function ProductVisual({product}){
  const img = PRODUCT_IMAGES[product.id];
  if(img){
    return (
      <div className="p-visual" style={{backgroundImage:"url("+img+")", backgroundSize:"cover", backgroundPosition:"center"}}>
        <span className="p-tag">{fmtCOP(product.price)}</span>
      </div>
    );
  }
  return <div className="p-visual">{product.emoji}<span className="p-tag">{fmtCOP(product.price)}</span></div>;
}

const timeAgo = (iso) => {
  const diff = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if(diff < 60) return "hace un momento";
  if(diff < 3600) return "hace " + Math.floor(diff/60) + " min";
  if(diff < 86400) return "hace " + Math.floor(diff/3600) + " h";
  return "hace " + Math.floor(diff/86400) + " d";
};
